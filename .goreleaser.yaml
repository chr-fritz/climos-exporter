before:
  hooks:
    - make buildDeps
    # You may remove this if you don't use go modules.
    - go mod download
    # you may remove this if you don't need go generate
    - make generate completions
builds:
  - id: climos-exporter
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm
      - arm64
    goarm:
      - "7"
    ldflags:
      - -X 'github.com/chr-fritz/climos-exporter/version.Version={{.Version}}'
      - -X 'github.com/chr-fritz/climos-exporter/version.Revision={{.ShortCommit}}'
      - -X 'github.com/chr-fritz/climos-exporter/version.Branch={{.Branch}}'
      - -X 'github.com/chr-fritz/climos-exporter/version.CommitDate={{.CommitTimestamp}}'
      - -s -w -extldflags '-static'

dockers_v2:
  - images:
      - ghcr.io/chr-fritz/climos-exporter
    tags:
      - "v{{.Version}}"
      - "{{ if or .IsSnapshot .IsDraft }}nightly{{ end }}"
      - "{{ if not (or .IsSnapshot .IsDraft) }}latest{{ end }}"
      - "{{ if not (or .IsSnapshot .IsDraft) }}v{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if not (or .IsSnapshot .IsDraft) }}v{{ .Major }}{{ end }}"
    labels:
      org.opencontainers.image.created: "{{.CommitDate}}"
      org.opencontainers.image.title: "{{.ProjectName}}"
      org.opencontainers.image.revision: "{{.FullCommit}}"
      org.opencontainers.image.version: "{{.Version}}"
      org.opencontainers.image.url: "https://github.com/chr-fritz/climos-exporter"
      org.opencontainers.image.licenses: "Apache-2.0"
    sbom: "{{ not .IsSnapshot }}"
    extra_files:
      - etc_passwd

sboms:
  - artifacts: archive

archives:
  - files:
      - README.md
      - LICENSE
      - completions/*
#      - docs/**
checksum:
  name_template: 'checksums.txt'
snapshot:
  version_template: "{{ .Tag }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
release:
  footer: |
    ## Docker Images

    [ghcr.io/chr-fritz/climos-exporter](https://ghcr.io/chr-fritz/climos-exporter)
    * `ghcr.io/chr-fritz/climos-exporter:latest`
    * `ghcr.io/chr-fritz/climos-exporter:{{ .Tag }}`
    * `ghcr.io/chr-fritz/climos-exporter:v{{ .Major }}.{{ .Minor }}`
    * `ghcr.io/chr-fritz/climos-exporter:v{{ .Major }}`

    ## Thanks!

    Those were the changes on {{ .Tag }}!
